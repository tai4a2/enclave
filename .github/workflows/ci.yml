name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the build light: no debug info for dependencies, so the runner does not
  # run out of disk/RAM while compiling the vendored SQLCipher + OpenSSL.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Pin the toolchain the project declares in rust-toolchain.toml instead of
      # tracking `stable`: the action exports RUSTUP_TOOLCHAIN, which overrides
      # the file, so CI would otherwise run a newer stable whose extra lints make
      # `clippy -D warnings` fail. Pinning keeps CI reproducible.
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: system deps
        # keyring (sync-secret-service) builds libdbus-sys, which needs the dbus
        # development headers; SQLCipher/OpenSSL are vendored but still need cc.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        id: clippy
        # Capture the diagnostics and re-emit them as workflow annotations
        # (visible through the public check-run API, unlike the raw job log).
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "--- toolchain ---"
            rustc -vV || true
            cargo clippy --version || true
          } > clippy.txt
          cargo clippy --all-targets -- -D warnings 2>&1 | tee -a clippy.txt
      - name: clippy report
        if: steps.clippy.outcome == 'failure'
        run: |
          emit() { echo "$1 title=$2::${3//'%'/'%25'}"; }
          emit "::notice" "toolchain" "$(sed -n '2p' clippy.txt)"
          grep -m 6 -E "error(\[|:)" clippy.txt | while IFS= read -r l; do emit "::error" "clippy" "$l"; done
          emit "::error" "clippy" "--- tail ---"
          tail -n 3 clippy.txt | while IFS= read -r l; do emit "::error" "clippy" "$l"; done
          exit 1
      - name: test
        run: cargo test --all-targets

  audit:
    name: cargo-audit (RUSTSEC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cargo-audit
      - name: audit
        run: cargo audit

  deny:
    name: cargo-deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-cyclonedx --locked || true
      - run: cargo cyclonedx --format json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"
