# cargo-deny configuration — supply-chain policy for Enclave.
#
# Run locally:  cargo deny check
# In CI:        see .github/workflows/ci.yml
#
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
# Target platforms we care about.
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[advisories]
# Fail the build on any known vulnerability in the dependency tree.
version = 2
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only. Add exceptions explicitly and justify them.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
    # Permissive data license used by the Mozilla `webpki-roots` certificate bundle.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Never allow these crates back into the tree.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []