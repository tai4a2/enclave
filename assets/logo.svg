<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Enclave logo">
  <title>Enclave</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181a22"/>
      <stop offset="1" stop-color="#0c0d11"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="36%" r="62%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#2b2d36" stroke-width="3"/>
  <circle cx="256" cy="216" r="198" fill="url(#glow)"/>

  <!-- shield (the wall) -->
  <path d="M256 74 L410 142 V274 C410 358 338 418 256 446 C174 418 102 358 102 274 V142 Z"
        fill="url(#accent)"/>
  <path d="M256 74 L410 142 V274 C410 358 338 418 256 446 C174 418 102 358 102 274 V142 Z"
        fill="none" stroke="#ece7ff" stroke-opacity="0.35" stroke-width="3"/>

  <!-- inner vault plate -->
  <path d="M256 114 L374 163 V274 C374 335 320 382 256 406 C192 382 138 335 138 274 V163 Z"
        fill="#14151b"/>
  <path d="M256 114 L374 163 V274 C374 335 320 382 256 406 C192 382 138 335 138 274 V163 Z"
        fill="none" stroke="#2f3140" stroke-width="3"/>

  <!-- vault ring + keyhole -->
  <circle cx="256" cy="234" r="74" fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.9"/>
  <circle cx="256" cy="220" r="27" fill="url(#accent)"/>
  <path d="M247 236 h18 l6 55 a15 15 0 0 1 -30 0 z" fill="url(#accent)"/>
</svg>
