[package]
name = "enclave"
version = "0.1.0"
edition = "2021"
description = "Privacy-first AI CLI with encrypted memory"
license = "MIT"
authors = ["Mauro"]
readme = "README.md"
repository = "https://github.com/enclave/enclave"

[[bin]]
name = "enclave"
path = "src/main.rs"

[lib]
name = "enclave"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "fs", "process", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
futures = "0.3"
thiserror = "1"
anyhow = "1"
directories = "5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = "0.5"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
rpassword = "7"
async-trait = "0.1"
async-stream = "0.3"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
termimad = "0.30"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1
