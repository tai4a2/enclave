<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Enclave — privacy-first AI coding assistant">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14151b"/>
      <stop offset="0.6" stop-color="#101117"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bbg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="1277" height="357" rx="26.5" fill="none" stroke="#2c2e36" stroke-width="3"/>

  <!-- mark -->
  <g transform="translate(60,60) scale(0.47)">
    <path d="M256 84 L400 146 V268 C400 348 334 408 256 436 C178 408 112 348 112 268 V146 Z" fill="url(#accent)"/>
    <path d="M256 120 L368 168 V268 C368 330 318 378 256 402 C194 378 144 330 144 268 V168 Z" fill="#101117"/>
    <circle cx="256" cy="236" r="34" fill="url(#accent)"/>
    <rect x="242" y="258" width="28" height="72" rx="14" fill="url(#accent)"/>
  </g>

  <!-- wordmark -->
  <text x="330" y="168" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="92" font-weight="700" fill="#e2e2e8" letter-spacing="1">Enclave</text>
  <text x="336" y="214" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="26" font-weight="500" fill="#a78bfa">Privacy-first AI coding assistant · encrypted by design</text>

  <!-- feature line -->
  <text x="336" y="268" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="21" font-weight="400" fill="#848694">SQLCipher memory · Argon2id · privacy guard · egress ledger · air-gap · TUI + local web UI</text>

  <!-- badge -->
  <g>
    <rect x="336" y="296" width="150" height="34" rx="17" fill="#1e1f25" stroke="#2c2e36"/>
    <text x="411" y="319" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
          font-size="16" font-weight="600" fill="#a78bfa">Rust · MIT</text>
  </g>
