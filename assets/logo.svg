<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Enclave logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181a22"/>
      <stop offset="1" stop-color="#0d0e12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#2c2e36" stroke-width="3"/>

  <!-- shield -->
  <path d="M256 84 L400 146 V268 C400 348 334 408 256 436 C178 408 112 348 112 268 V146 Z"
        fill="url(#accent)"/>
  <path d="M256 84 L400 146 V268 C400 348 334 408 256 436 C178 408 112 348 112 268 V146 Z"
        fill="none" stroke="url(#edge)" stroke-width="4"/>

  <!-- inner shield cut-out for depth -->
  <path d="M256 120 L368 168 V268 C368 330 318 378 256 402 C194 378 144 330 144 268 V168 Z"
        fill="#14151b"/>

  <!-- keyhole -->
  <circle cx="256" cy="236" r="34" fill="url(#accent)"/>
  <rect x="242" y="258" width="28" height="72" rx="14" fill="url(#accent)"/>

  <!-- four corner brackets: "enclave" walls -->
  <g stroke="#a78bfa" stroke-width="6" stroke-linecap="round" opacity="0.55">
    <path d="M104 148 V120 H132"/>
    <path d="M380 120 H408 V148"/>
    <path d="M408 364 V392 H380"/>
    <path d="M132 392 H104 V364"/>
  </g>
</svg>
